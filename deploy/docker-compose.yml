# Usage on the VPS (from the repo root):
#   DOMAIN=game.example.com docker compose -f deploy/docker-compose.yml up -d --build
# Caddy obtains HTTPS certificates automatically; point the domain's A record at the VPS first.
# Without a domain, use DOMAIN=:80 to serve plain HTTP on port 80.
services:
  app:
    build: ..
    restart: unless-stopped
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
